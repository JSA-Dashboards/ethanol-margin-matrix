name: Refresh AMS & futures data

on:
  schedule:
    # ~00:05 US Central. GitHub Actions cron is UTC-only and doesn't observe DST,
    # so this lands at 00:05 CDT (Mar-Nov) or 23:05 CST the prior night (Nov-Mar).
    - cron: "5 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh AMS snapshots
        env:
          USDA_MARS_API_KEY: ${{ secrets.USDA_MARS_API_KEY }}
        run: python ethanol_grind.py

      - name: Refresh futures history archive
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python refresh_futures_archive.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ams_ethanol_weekly.csv data/ams_plant_corn.csv data/futures_history_archive.csv
          if git diff --cached --quiet; then
            echo "No new data — nothing to commit."
          else
            git commit -m "Nightly AMS & futures data refresh"
            git push
          fi
